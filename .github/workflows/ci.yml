# Integration continue de HOPE : a chaque envoi sur dev ou main, et a
# chaque demande de fusion, le code est relu (ESLint), teste (node --test)
# et le frontend est construit comme en production.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

defaults:
  run:
    working-directory: AppHopePlat

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope-ci
          POSTGRES_DB: hope_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hope" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://hope:hope-ci@localhost:5432/hope_ci
      JWT_SECRET: secret-de-la-ci-uniquement-jamais-en-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AppHopePlat/backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run lint --prefix backend
      - run: npm run db:init --prefix backend
      - run: npm run db:migrate --prefix backend
      - run: npm test --prefix backend

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AppHopePlat/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
